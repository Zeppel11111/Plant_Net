<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塔石环境监测 · HMI 页面预览</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef5e9;
      --muted: #9cac9e;
      --panel: #101f1b;
      --canvas: #081512;
      --line: rgba(201, 225, 208, .11);
      --mint: #9bddad;
      --amber: #f2b66e;
      --aqua: #77d9c4;
      --lime: #d3e783;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #07100e;
      color: var(--ink);
      font-family: "Bahnschrift", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      letter-spacing: .015em;
    }
    .shell { width: min(1120px, calc(100vw - 40px)); margin: 26px auto 32px; }
    .topline { display:flex; justify-content:space-between; align-items:center; margin:0 4px 14px; color:#aab9ac; font-size:13px; }
    .brand { display:flex; gap:10px; align-items:center; letter-spacing:.16em; text-transform:uppercase; font-size:11px; }
    .brand-mark { width:8px; height:8px; border-radius:50%; background:#bce584; box-shadow:0 0 15px #9bddad; }
    .toolbar { display:flex; align-items:center; gap:8px; }
    .toolbar button {
      border:1px solid rgba(199,222,205,.14); border-radius:999px; background:#0f1c18;
      color:#dbe8dc; padding:7px 12px; font:inherit; font-size:12px; cursor:pointer;
      transition:background .18s ease,border-color .18s ease,transform .18s ease;
    }
    .toolbar button:hover { background:#192a23; border-color:rgba(199,222,205,.35); transform:translateY(-1px); }
    .toolbar button[aria-pressed="true"] { background:#193126; color:#c9edb5; border-color:#5d936b; }
    .frame {
      position:relative; overflow:hidden; border-radius:16px; background:#0a1713;
      border:1px solid rgba(201,225,208,.17); box-shadow:0 30px 90px rgba(0,0,0,.5), 0 0 0 5px rgba(181,211,189,.025);
    }
    svg { display:block; width:100%; height:auto; }
    .caption { display:flex; justify-content:space-between; gap:16px; margin:13px 4px 0; color:#87988b; font-size:12px; }
    .caption strong { color:#bdcdbf; font-weight:500; }
    @media (max-width:680px) {
      .shell { width:calc(100vw - 20px); margin:12px auto 20px; }
      .topline { align-items:flex-start; flex-direction:column; gap:12px; }
      .caption { flex-direction:column; gap:6px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <div class="brand"><span class="brand-mark"></span><span>TASTEK · LOCAL SENSOR PANEL</span></div>
      <div class="toolbar" aria-label="预览控制">
        <button id="onlineBtn" type="button" aria-pressed="true">模拟在线</button>
        <button id="offlineBtn" type="button" aria-pressed="false">模拟离线</button>
        <button id="refreshBtn" type="button">刷新示例值 ↻</button>
      </div>
    </div>

    <section class="frame" aria-label="1024乘600陶晶驰屏幕预览">
      <svg id="screen" viewBox="0 0 1024 600" role="img" aria-labelledby="screenTitle screenDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="screenTitle">塔石环境监测主页面</title>
        <desc id="screenDesc">深色温室仪表风格，显示空气温度、空气湿度和光照强度。</desc>
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1a15"/><stop offset=".52" stop-color="#0c1916"/><stop offset="1" stop-color="#07120f"/></linearGradient>
          <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#15251f"/><stop offset="1" stop-color="#101d19"/></linearGradient>
          <linearGradient id="tempGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2b66e" stop-opacity=".22"/><stop offset="1" stop-color="#f2b66e" stop-opacity="0"/></linearGradient>
          <linearGradient id="humidGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77d9c4" stop-opacity=".2"/><stop offset="1" stop-color="#77d9c4" stop-opacity="0"/></linearGradient>
          <linearGradient id="lightGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3e783" stop-opacity=".2"/><stop offset="1" stop-color="#d3e783" stop-opacity="0"/></linearGradient>
          <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c5d9ca" stroke-opacity=".035" stroke-width="1"/></pattern>
          <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
        </defs>
        <!-- Background field -->
        <rect width="1024" height="600" fill="url(#bg)"/>
        <rect width="1024" height="600" fill="url(#grid)"/>
        <circle cx="932" cy="101" r="140" fill="#4d7b58" opacity=".12" filter="url(#soft)"/>
        <path d="M-60 460C110 365 198 505 363 431S644 350 788 434s205 45 322-27" fill="none" stroke="#9bddad" stroke-opacity=".055" stroke-width="1.2"/>
        <path d="M-52 486C112 391 212 529 375 456s278-77 420 7 203 44 321-27" fill="none" stroke="#9bddad" stroke-opacity=".04" stroke-width="1.2"/>
        <path d="M-30 511C130 419 228 551 390 480s272-75 414 8 199 44 307-24" fill="none" stroke="#9bddad" stroke-opacity=".03" stroke-width="1.2"/>

        <!-- Header -->
        <rect x="38" y="34" width="4" height="58" rx="2" fill="#a8d784"/>
        <text x="60" y="59" fill="#f0f5e9" font-size="27" font-weight="650" letter-spacing=".02em">塔石环境监测</text>
        <text x="61" y="82" fill="#8da397" font-size="11" letter-spacing=".2em">ENVIRONMENT / LOCAL MONITOR</text>
        <g transform="translate(814 45)">
          <rect width="171" height="38" rx="19" fill="#13261d" stroke="#355843"/>
          <circle id="statusDot" cx="20" cy="19" r="4" fill="#a8df89"/>
          <circle id="statusHalo" cx="20" cy="19" r="8" fill="#a8df89" opacity=".12"/>
          <text id="statusText" x="35" y="23" fill="#bfe5aa" font-size="12" letter-spacing=".08em">传感器在线</text>
          <text x="153" y="23" text-anchor="end" fill="#73877a" font-size="9">01</text>
        </g>
        <text x="984" y="111" text-anchor="end" fill="#63796d" font-size="9" letter-spacing=".18em">TASTEK · MODBUS RTU</text>
        <line x1="38" y1="125" x2="986" y2="125" stroke="#c5d9ca" stroke-opacity=".12"/>

        <!-- Section label -->
        <text x="40" y="156" fill="#a9bba9" font-size="11" letter-spacing=".22em">实时环境</text>
        <text x="984" y="156" text-anchor="end" fill="#71867a" font-size="10" letter-spacing=".12em">LIVE READINGS</text>

        <!-- Temperature card -->
        <g transform="translate(40 177)">
          <rect width="300" height="293" rx="17" fill="url(#card)" stroke="#d0dfd2" stroke-opacity=".12"/>
          <rect width="300" height="293" rx="17" fill="url(#tempGlow)"/>
          <path d="M1 17Q1 1 17 1H283" fill="none" stroke="#f2b66e" stroke-opacity=".65" stroke-width="2"/>
          <g transform="translate(24 24)" fill="none" stroke="#f2b66e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a5 5 0 0 0-5 5v17a9 9 0 1 0 10 0V8a5 5 0 0 0-5-5Z"/>
            <path d="M12 14v15"/><circle cx="12" cy="30" r="3" fill="#f2b66e" stroke="none"/>
          </g>
          <text x="72" y="43" fill="#f0c28b" font-size="11" letter-spacing=".17em">AIR TEMPERATURE</text>
          <text x="24" y="117" fill="#eff4e9" font-size="61" font-weight="500" letter-spacing="-.045em"><tspan id="temperature">23.6</tspan><tspan fill="#f2b66e" font-size="27" baseline-shift="super">°C</tspan></text>
          <text x="25" y="145" fill="#9baa9d" font-size="12">空气温度</text>
          <line x1="24" y1="171" x2="276" y2="171" stroke="#d4e0d6" stroke-opacity=".1"/>
          <text x="24" y="198" fill="#758a7d" font-size="10" letter-spacing=".12em">舒适区间</text>
          <text x="276" y="198" text-anchor="end" fill="#bdc9bd" font-size="11">18 — 28 °C</text>
          <rect x="24" y="216" width="252" height="4" rx="2" fill="#f2b66e" opacity=".14"/>
          <rect x="24" y="216" width="137" height="4" rx="2" fill="#f2b66e"/>
          <circle cx="161" cy="218" r="5" fill="#f5c989"/>
          <path d="M24 250h12" stroke="#f2b66e" stroke-width="2" stroke-linecap="round"/>
          <text x="44" y="254" fill="#849589" font-size="10">读数稳定</text>
        </g>

        <!-- Humidity card -->
        <g transform="translate(362 177)">
          <rect width="300" height="293" rx="17" fill="url(#card)" stroke="#d0dfd2" stroke-opacity=".12"/>
          <rect width="300" height="293" rx="17" fill="url(#humidGlow)"/>
          <path d="M1 17Q1 1 17 1H283" fill="none" stroke="#77d9c4" stroke-opacity=".65" stroke-width="2"/>
          <g transform="translate(24 24)" fill="none" stroke="#77d9c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2C10 8 4 15 4 21a9 9 0 0 0 18 0c0-6-6-13-9-19Z"/>
            <path d="M9 23c.5 2 2 3 4 3"/>
          </g>
          <text x="72" y="43" fill="#8adccc" font-size="11" letter-spacing=".17em">AIR HUMIDITY</text>
          <text x="24" y="117" fill="#eff4e9" font-size="61" font-weight="500" letter-spacing="-.045em"><tspan id="humidity">58.4</tspan><tspan fill="#77d9c4" font-size="27" baseline-shift="super">%</tspan></text>
          <text x="25" y="145" fill="#9baa9d" font-size="12">空气湿度 <tspan fill="#728b82">%RH</tspan></text>
          <line x1="24" y1="171" x2="276" y2="171" stroke="#d4e0d6" stroke-opacity=".1"/>
          <text x="24" y="198" fill="#758a7d" font-size="10" letter-spacing=".12em">适宜区间</text>
          <text x="276" y="198" text-anchor="end" fill="#bdc9bd" font-size="11">40 — 70 %RH</text>
          <rect x="24" y="216" width="252" height="4" rx="2" fill="#77d9c4" opacity=".14"/>
          <rect x="24" y="216" width="154" height="4" rx="2" fill="#77d9c4"/>
          <circle cx="178" cy="218" r="5" fill="#a3ebd9"/>
          <path d="M24 250h12" stroke="#77d9c4" stroke-width="2" stroke-linecap="round"/>
          <text x="44" y="254" fill="#849589" font-size="10">环境适中</text>
        </g>

        <!-- Light card -->
        <g transform="translate(684 177)">
          <rect width="300" height="293" rx="17" fill="url(#card)" stroke="#d0dfd2" stroke-opacity=".12"/>
          <rect width="300" height="293" rx="17" fill="url(#lightGlow)"/>
          <path d="M1 17Q1 1 17 1H283" fill="none" stroke="#d3e783" stroke-opacity=".65" stroke-width="2"/>
          <g transform="translate(24 24)" fill="none" stroke="#d3e783" stroke-width="1.8" stroke-linecap="round">
            <circle cx="13" cy="13" r="5"/><path d="M13 1v3M13 22v3M1 13h3M22 13h3M4.5 4.5l2.2 2.2m12.6 12.6 2.2 2.2m0-17-2.2 2.2M6.7 19.3l-2.2 2.2"/>
          </g>
          <text x="72" y="43" fill="#d4e78b" font-size="11" letter-spacing=".17em">ILLUMINANCE</text>
          <text x="24" y="117" fill="#eff4e9" font-size="54" font-weight="500" letter-spacing="-.045em"><tspan id="light">1,280</tspan></text>
          <text x="25" y="145" fill="#9baa9d" font-size="12">光照强度 <tspan fill="#d3e783">lux</tspan></text>
          <line x1="24" y1="171" x2="276" y2="171" stroke="#d4e0d6" stroke-opacity=".1"/>
          <text x="24" y="198" fill="#758a7d" font-size="10" letter-spacing=".12em">环境光照</text>
          <text x="276" y="198" text-anchor="end" fill="#bdc9bd" font-size="11">0 — 3,000 lux</text>
          <rect x="24" y="216" width="252" height="4" rx="2" fill="#d3e783" opacity=".14"/>
          <rect x="24" y="216" width="108" height="4" rx="2" fill="#d3e783"/>
          <circle cx="132" cy="218" r="5" fill="#ecf6ab"/>
          <path d="M24 250h12" stroke="#d3e783" stroke-width="2" stroke-linecap="round"/>
          <text x="44" y="254" fill="#849589" font-size="10">光照正常</text>
        </g>

        <!-- Footer -->
        <g transform="translate(40 505)">
          <path d="M0 0h26" stroke="#9bddad" stroke-width="2" stroke-linecap="round"/>
          <text x="0" y="24" fill="#9bad9f" font-size="10" letter-spacing=".12em">采集设备</text>
          <text x="0" y="47" fill="#e4ece2" font-size="13">塔石环境传感器</text>
          <line x1="227" y1="5" x2="227" y2="46" stroke="#c5d9ca" stroke-opacity=".12"/>
          <text x="252" y="24" fill="#9bad9f" font-size="10" letter-spacing=".12em">通讯方式</text>
          <text x="252" y="47" fill="#e4ece2" font-size="13">Modbus RTU <tspan fill="#778d80" font-size="10">· 9600 / 8N1</tspan></text>
          <line x1="550" y1="5" x2="550" y2="46" stroke="#c5d9ca" stroke-opacity=".12"/>
          <text x="576" y="24" fill="#9bad9f" font-size="10" letter-spacing=".12em">数据更新</text>
          <text id="updatedAt" x="576" y="47" fill="#e4ece2" font-size="13">刚刚</text>
          <g transform="translate(802 14)">
            <circle cx="4" cy="4" r="3" fill="#a8df89"/>
            <text x="16" y="8" fill="#9bad9f" font-size="10" letter-spacing=".1em">LOCAL DISPLAY</text>
          </g>
        </g>
        <text x="984" y="581" text-anchor="end" fill="#40594c" font-size="8" letter-spacing=".16em">TJC 1024 × 600 / MAIN</text>
      </svg>
    </section>

    <div class="caption">
      <span><strong>主页面预览</strong> · 1024 × 600 · 深色温室仪表风格</span>
      <span>网页内数值仅用于排版预览，不是传感器实测值。</span>
    </div>
  </main>
  <script>
    const values = [
      ["23.6", "58.4", "1,280"],
      ["24.1", "57.9", "1,315"],
      ["23.8", "58.1", "1,296"],
      ["24.0", "58.6", "1,342"]
    ];
    let sample = 0;
    let online = true;
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const statusHalo = document.getElementById("statusHalo");
    const screen = document.getElementById("screen");
    const buttons = [document.getElementById("onlineBtn"), document.getElementById("offlineBtn")];
    function setMode(isOnline) {
      online = isOnline;
      statusText.textContent = online ? "传感器在线" : "等待传感器数据";
      statusText.setAttribute("fill", online ? "#bfe5aa" : "#edbd7b");
      statusDot.setAttribute("fill", online ? "#a8df89" : "#edbd7b");
      statusHalo.setAttribute("fill", online ? "#a8df89" : "#edbd7b");
      screen.style.opacity = online ? "1" : ".7";
      ["temperature", "humidity", "light"].forEach((id) => {
        document.getElementById(id).textContent = online ? values[sample][["temperature", "humidity", "light"].indexOf(id)] : "--";
      });
      buttons[0].setAttribute("aria-pressed", String(online));
      buttons[1].setAttribute("aria-pressed", String(!online));
      document.getElementById("updatedAt").textContent = online ? new Date().toLocaleTimeString("zh-CN", {hour12:false}) : "暂无新数据";
    }
    document.getElementById("onlineBtn").addEventListener("click", () => setMode(true));
    document.getElementById("offlineBtn").addEventListener("click", () => setMode(false));
    document.getElementById("refreshBtn").addEventListener("click", () => {
      sample = (sample + 1) % values.length;
      setMode(online);
    });
    setMode(true);
  </script>
</body>
</html>
